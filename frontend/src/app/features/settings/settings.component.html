<div class="space-y-6 max-w-2xl">
  
  <!-- Header -->
  <div>
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight font-sans">Settings</h1>
    <p class="text-slate-500 dark:text-slate-400 mt-1">Configure your personal interface options, preferences, and alerts.</p>
  </div>

  <!-- Settings Cards Panel -->
  <div class="bg-white dark:bg-darkBg-100 border border-slate-200/50 dark:border-white/5 rounded-2xl p-6 shadow-premium space-y-6">
    
    <!-- Theme Configuration Section -->
    <div>
      <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Theme Selection</h3>
      
      <div class="grid grid-cols-2 gap-4">
        <!-- Light Card -->
        <button (click)="setTheme('light')" 
                [ngClass]="getCurrentTheme() === 'light' 
                  ? 'border-primary-500 bg-primary-500/10 text-primary-600 dark:text-primary-400 ring-2 ring-primary-500/30' 
                  : 'border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'"
                class="p-4 rounded-xl border flex flex-col items-center gap-2 font-semibold text-sm transition-all cursor-pointer">
          <span class="material-icons text-2xl">light_mode</span>
          <span>Light Mode</span>
        </button>

        <!-- Dark Card -->
        <button (click)="setTheme('dark')" 
                [ngClass]="getCurrentTheme() === 'dark' 
                  ? 'border-primary-500 bg-primary-500/10 text-primary-600 dark:text-primary-400 ring-2 ring-primary-500/30' 
                  : 'border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'"
                class="p-4 rounded-xl border flex flex-col items-center gap-2 font-semibold text-sm transition-all cursor-pointer">
          <span class="material-icons text-2xl">dark_mode</span>
          <span>Dark Mode</span>
        </button>
      </div>
    </div>

    <!-- Preferences Form -->
    <form [formGroup]="settingsForm" class="space-y-6 border-t border-slate-100 dark:border-slate-850 pt-6">
      
      <!-- Notifications Preference -->
      <div>
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Alerts & Notifications</h3>
        
        <label class="flex items-start gap-3 cursor-pointer group">
          <input type="checkbox" formControlName="emailNotifications" (change)="onToggleChange()"
                 class="h-4 w-4 rounded border-slate-350 text-primary-500 focus:ring-primary-500 mt-1 cursor-pointer">
          <div>
            <span class="text-sm font-semibold text-slate-800 dark:text-slate-200 group-hover:text-slate-950 dark:group-hover:text-white transition-colors">Email Notifications</span>
            <p class="text-xs text-slate-400">Receive system activity alerts, report summaries, and account logs directly via email.</p>
          </div>
        </label>
      </div>

      <!-- Two Factor Authentication Preference -->
      <div class="border-t border-slate-100 dark:border-slate-850 pt-6">
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Security Features</h3>
        
        <label class="flex items-start gap-3 cursor-pointer group">
          <input type="checkbox" formControlName="twoFactorEnabled" (change)="onToggleChange()"
                 class="h-4 w-4 rounded border-slate-350 text-primary-500 focus:ring-primary-500 mt-1 cursor-pointer">
          <div>
            <span class="text-sm font-semibold text-slate-800 dark:text-slate-200 group-hover:text-slate-950 dark:group-hover:text-white transition-colors">Two-Factor Authentication</span>
            <p class="text-xs text-slate-400">Add an extra layer of protection by requiring a security token upon authentication.</p>
          </div>
        </label>
      </div>

    </form>

    <!-- Save Indicator -->
    <div *ngIf="isSaving()" class="flex items-center justify-end gap-2 text-xs text-primary-500 font-semibold animate-pulse">
      <span class="h-1.5 w-1.5 rounded-full bg-primary-500"></span>
      Saving changes...
    </div>

  </div>

</div>
